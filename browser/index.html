<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OKEAN Лодка</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Новый блок: Статус Wi-Fi -->
  <div class="wifi-status">
    <h2>📡 Сетевое подключение</h2>
    <div class="status-row">
      <strong>Устройство:</strong>
      <span id="deviceStatus">неизвестно</span>
    </div>
    <div class="status-row">
      <strong>Подключено к:</strong>
      <span id="currentNetwork">—</span>
    </div>
    <div class="status-row">
      <strong>IP-адрес:</strong>
      <span id="deviceIP">—</span>
    </div>
    <button id="scanBtn">Обновить сети</button>
    <button id="startAPBtn">Запустить точку доступа</button>
  </div>

  <!-- Блок настроек подключения -->
  <div class="setup">
    <h2>🔧 Настройка управления</h2>
    <div>
      <label>IP сервера:</label>
      <input type="text" id="serverIP" placeholder="192.168.4.1" value="192.168.4.1">
    </div>
    <div>
      <label>Пароль:</label>
      <input type="password" id="devicePassword" placeholder="введите пароль">
    </div>
    <button id="connectBtn">Подключиться</button>
    <div class="status">Статус: не подключено</div>
  </div>

  <!-- Основной интерфейс (управление) -->
  <div class="control-panel" id="controlPanel" style="display: none;">
    <h1>🌊 OKEAN Лодка — Управление</h1>
    <button id="btnOn" class="on">ВКЛ</button>
    <button id="btnOff" class="off">ВЫКЛ</button>
    <button id="backBtn">Назад</button>
  </div>

  <script src="script/main.js"></script>
</body>
</html>
